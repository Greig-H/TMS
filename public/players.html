<!DOCTYPE html>
<html>

<head>
  <title>CoachBoard Players</title>

  <!-- Viewport for Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    /* NAVBAR */
    .navbar-custom {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    }

    .navbar-custom .navbar-brand {
      color: #FFD700;
      font-weight: 700;
      font-size: 1.5rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .navbar-custom .nav-link {
      color: #fff;
      margin-left: 20px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .navbar-custom .nav-link:hover {
      color: #FFD700;
      transform: translateY(-1px);
    }

    .navbar-custom .nav-link.active {
      color: #FFD700;
    }

    .navbar-custom .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #FFD700;
      border-radius: 1px;
    }

    /* MOBILE NAV IMPROVEMENTS */
    @media (max-width: 991px) {
      .navbar-custom {
        padding: 10px 15px;
      }

      .navbar-custom .navbar-brand {
        font-size: 1.2rem;
      }

      .navbar-custom .nav-link {
        margin-left: 0;
        padding: 10px 15px;
        text-align: center;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .navbar-custom .nav-link:hover {
        background: rgba(255, 215, 0, 0.1);
        color: #FFD700;
      }

      .navbar-collapse {
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        margin-top: 10px;
        padding: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }
    }

    /* CONTAINER */
    .container {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 30px;
      color: white;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      font-size: 2.5rem;
    }

    /* BUTTONS */
    .btn-gold {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
    }

    /* SEARCH */
    .search-input {
      padding: 12px 16px;
      width: 100%;
      max-width: 350px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
    }

    /* TABLE CARD */
    .table-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      min-width: 600px; /* Ensure table doesn't get too narrow */
    }

    th,
    td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: rgba(102, 126, 234, 0.05);
    }

    /* ACTION BUTTONS */
    .btn-edit {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .btn-delete {
      background: linear-gradient(135deg, #dc3545, #c82333);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 8px;
      transition: all 0.3s ease;
    }

    .btn-edit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
    }

    .btn-delete:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
    }

    /* ACTIONS CONTAINER */
    .actions-cell {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* MODAL FORM */
    .modal-content {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-radius: 20px 20px 0 0;
      border-bottom: none;
      padding: 20px 30px;
    }

    .modal-title {
      font-weight: 600;
      font-size: 1.2rem;
    }

    .modal-body {
      padding: 30px;
    }

    .modal-footer {
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      padding: 20px 30px;
      border-radius: 0 0 20px 20px;
    }

    .form-label {
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .form-control {
      border-radius: 10px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      padding: 12px 16px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }

      h2 {
        font-size: 2rem;
      }

      .table-card {
        padding: 20px;
        -webkit-overflow-scrolling: touch;
      }

      table {
        font-size: 0.9rem;
      }

      th, td {
        padding: 10px;
      }

      .btn-edit, .btn-delete {
        padding: 8px 16px;
        font-size: 0.8rem;
        min-height: 36px;
        min-width: 60px;
      }

      /* Touch-friendly buttons */
      .btn-gold {
        min-height: 44px;
        padding: 12px 20px;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 500px) {
      .search-input {
        max-width: 100%;
        min-height: 44px;
        font-size: 16px; /* Prevent zoom on iOS */
      }

      .table-card {
        padding: 10px;
      }

      table {
        font-size: 0.8rem;
      }

      th, td {
        padding: 6px 8px;
      }

      .btn-edit, .btn-delete {
        padding: 6px 12px;
        font-size: 0.7rem;
        min-height: 32px;
        min-width: 50px;
      }

      /* Stack action buttons vertically on very small screens */
      .actions-cell {
        flex-direction: column;
        gap: 4px;
        align-items: stretch;
      }

      .btn-edit, .btn-delete {
        margin-left: 0;
        width: 100%;
        min-width: auto;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand logo" href="dashboard.html">CoachBoard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks"
        aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarLinks">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="players.html">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="sessions.html">Sessions</a></li>
          <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTAINER -->
  <div class="container">

    <h2>Players</h2>

    <!-- ADD PLAYER BUTTON -->
    <button class="btn-gold" onclick="openAddModal()">Add Player</button>

    <!-- SEARCH -->
    <input type="text" placeholder="Search players..." class="search-input">

    <!-- TABLE CARD -->
    <div class="table-card">
      <table id="playersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Position</th>
            <th>Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="playersTableBody">
          <!-- Dynamic rows will be added here -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- ADD / EDIT PLAYER MODAL -->
  <div class="modal fade" id="playerModal" tabindex="-1" aria-labelledby="playerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="playerModalLabel">Add Player</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="playerForm">
            <div class="mb-3">
              <label for="playerName" class="form-label">Name</label>
              <input type="text" class="form-control" id="playerName" required>
            </div>
            <div class="mb-3">
              <label for="playerPosition" class="form-label">Position</label>
              <input type="text" class="form-control" id="playerPosition" required>
            </div>
            <div class="mb-3">
              <label for="playerPhone" class="form-label">Phone</label>
              <input type="text" class="form-control" id="playerPhone" required>
            </div>
            <button type="submit" class="btn btn-gold">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let editingPlayerId = null;

    // Load players on page load
    document.addEventListener('DOMContentLoaded', loadPlayers);

    async function loadPlayers() {
      try {
        const response = await fetch('/api/players');
        const players = await response.json();
        const tbody = document.getElementById('playersTableBody');
        tbody.innerHTML = '';
        players.forEach(player => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${player.name}</td>
            <td>${player.position || ''}</td>
            <td>${player.phone || ''}</td>
            <td>
              <div class="actions-cell">
                <button class="btn-edit" onclick="openEditModal(${player.id}, '${player.name}', '${player.position || ''}', '${player.phone || ''}')">Edit</button>
                <button class="btn-delete" onclick="deletePlayer(${player.id})">Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('Error loading players:', error);
      }
    }

    function openEditModal(id, name, position, phone) {
      editingPlayerId = id;
      document.getElementById('playerName').value = name;
      document.getElementById('playerPosition').value = position;
      document.getElementById('playerPhone').value = phone;
      document.getElementById('playerModalLabel').innerText = 'Edit Player';
      new bootstrap.Modal(document.getElementById('playerModal')).show();
    }

    function openAddModal() {
      editingPlayerId = null;
      document.getElementById('playerForm').reset();
      document.getElementById('playerModalLabel').innerText = 'Add Player';
      new bootstrap.Modal(document.getElementById('playerModal')).show();
    }

    // Handle form submit
    document.getElementById('playerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('playerName').value;
      const position = document.getElementById('playerPosition').value;
      const phone = document.getElementById('playerPhone').value;

      try {
        if (editingPlayerId) {
          // Update player
          await fetch(`/api/players/${editingPlayerId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, position, phone })
          });
        } else {
          // Add player
          await fetch('/api/players', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, position, phone })
          });
        }
        loadPlayers(); // Reload the table
        bootstrap.Modal.getInstance(document.getElementById('playerModal')).hide();
        this.reset();
        editingPlayerId = null;
        document.getElementById('playerModalLabel').innerText = 'Add Player';
      } catch (error) {
        console.error('Error saving player:', error);
      }
    });

    async function deletePlayer(id) {
      if (confirm('Are you sure you want to delete this player?')) {
        try {
          await fetch(`/api/players/${id}`, { method: 'DELETE' });
          loadPlayers(); // Reload the table
        } catch (error) {
          console.error('Error deleting player:', error);
        }
      }
    }
  </script>

</body>

</html>
