<!DOCTYPE html>
<html>

<head>
  <title>CoachBoard Players</title>

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    /* NAVBAR */
    .navbar-custom {
      background: linear-gradient(90deg, #000, #1a1a1a);
    }

    .navbar-custom .navbar-brand {
      color: #FFD700;
      font-weight: 700;
    }

    .navbar-custom .nav-link {
      color: white;
      margin-left: 10px;
      font-weight: 500;
    }

    .navbar-custom .nav-link:hover {
      color: #FFD700;
    }

    .navbar-custom .navbar-toggler-icon {
      filter: invert(1);
    }

    /* CONTAINER */
    .container {
      padding: 30px;
    }

    h2 {
      margin-bottom: 20px;
    }

    /* BUTTONS */
    .btn-gold {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      transition: all 0.25s ease;
      margin-bottom: 15px;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 215, 0, 0.4);
    }

    /* SEARCH */
    .search-input {
      padding: 8px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    /* TABLE CARD */
    .table-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      color: #777;
    }

    /* ACTION BUTTONS */
    .btn-edit {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      color: black;
    }

    .btn-delete {
      background: linear-gradient(135deg, #C10000, #800000);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      margin-left: 5px;
    }

    .btn-edit:hover {
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
    }

    .btn-delete:hover {
      box-shadow: 0 4px 12px rgba(200, 0, 0, 0.5);
    }

    /* MODAL FORM */
    .modal-header {
      background: #000;
      color: #FFD700;
    }

    .modal-footer .btn-gold {
      margin: 0;
    }

    /* MOBILE ADJUST */
    @media (max-width: 768px) {
      table {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand logo" href="dashboard.html">CoachBoard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks"
        aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarLinks">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="players.html">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="sessions.html">Sessions</a></li>
          <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTAINER -->
  <div class="container">

    <h2>Players</h2>

    <!-- ADD PLAYER BUTTON -->
    <button class="btn-gold" data-bs-toggle="modal" data-bs-target="#playerModal">Add Player</button>

    <!-- SEARCH -->
    <input type="text" placeholder="Search players..." class="search-input">

    <!-- TABLE CARD -->
    <div class="table-card">
      <table id="playersTable">
        <tr>
          <th>Name</th>
          <th>Position</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
        <tr>
          <td>John Doe</td>
          <td>Forward</td>
          <td>+256700000000</td>
          <td>
            <button class="btn-edit" onclick="openEditModal('John Doe','Forward','+256700000000')">Edit</button>
            <button class="btn-delete" onclick="deleteRow(this)">Delete</button>
          </td>
        </tr>
        <tr>
          <td>Michael Smith</td>
          <td>Midfielder</td>
          <td>+256711111111</td>
          <td>
            <button class="btn-edit" onclick="openEditModal('Michael Smith','Midfielder','+256711111111')">Edit</button>
            <button class="btn-delete" onclick="deleteRow(this)">Delete</button>
          </td>
        </tr>
      </table>
    </div>

  </div>

  <!-- ADD / EDIT PLAYER MODAL -->
  <div class="modal fade" id="playerModal" tabindex="-1" aria-labelledby="playerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="playerModalLabel">Add Player</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="playerForm">
            <div class="mb-3">
              <label for="playerName" class="form-label">Name</label>
              <input type="text" class="form-control" id="playerName" required>
            </div>
            <div class="mb-3">
              <label for="playerPosition" class="form-label">Position</label>
              <input type="text" class="form-control" id="playerPosition" required>
            </div>
            <div class="mb-3">
              <label for="playerPhone" class="form-label">Phone</label>
              <input type="text" class="form-control" id="playerPhone" required>
            </div>
            <button type="submit" class="btn btn-gold">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Open Edit Modal and pre-fill
    function openEditModal(name, position, phone) {
      document.getElementById('playerModalLabel').innerText = 'Edit Player';
      document.getElementById('playerName').value = name;
      document.getElementById('playerPosition').value = position;
      document.getElementById('playerPhone').value = phone;
      var myModal = new bootstrap.Modal(document.getElementById('playerModal'));
      myModal.show();
    }

    // Delete Row
    function deleteRow(btn) {
      const row = btn.closest('tr');
      row.remove();
    }

    // Handle form submit
    document.getElementById('playerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('playerName').value;
      const position = document.getElementById('playerPosition').value;
      const phone = document.getElementById('playerPhone').value;

      const table = document.getElementById('playersTable');
      const newRow = table.insertRow(-1);
      newRow.innerHTML = `
        <td>${name}</td>
        <td>${position}</td>
        <td>${phone}</td>
        <td>
          <button class="btn-edit" onclick="openEditModal('${name}','${position}','${phone}')">Edit</button>
          <button class="btn-delete" onclick="deleteRow(this)">Delete</button>
        </td>
      `;
      // Close modal
      bootstrap.Modal.getInstance(document.getElementById('playerModal')).hide();
      // Reset form
      this.reset();
      document.getElementById('playerModalLabel').innerText = 'Add Player';
    });
  </script>

</body>

</html>
