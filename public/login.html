<!DOCTYPE html>
<html>
<head>

<title>CoachBoard Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:Inter;
background:linear-gradient(135deg,#000,#1a1a1a);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}

.login-card{
background:white;
padding:40px;
border-radius:14px;
width:320px;
box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.login-title{
text-align:center;
color:#C9A227;
margin-bottom:25px;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:8px;
border:1px solid #ddd;
}

.btn-gold{
background:linear-gradient(135deg,#FFD700,#C9A227);
border:none;
padding:10px;
width:100%;
border-radius:8px;
font-weight:600;
cursor:pointer;
}
.tagline{
text-align:center;
font-size:14px;
color:#777;
margin-top:-10px;
margin-bottom:25px;
}

</style>

</head>

<body>

<div class="login-card">

<h2 class="login-title">CoachBoard</h2>
<p class="tagline">
Manage your team's training sessions efficiently
</p>

<input placeholder="Email">

<input type="password" placeholder="Password">

<button class="btn-gold">Login</button>

<p style="text-align:center;margin-top:15px;">
Don't have an account?
<a href="signup.html" style="color:#C9A227;font-weight:600;text-decoration:none;">
Sign Up
</a>
</p>

</div>


</body>
</html>
