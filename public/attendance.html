<!DOCTYPE html>
<html>

<head>
  <title>CoachBoard Attendance</title>

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    /* NAVBAR */
    .navbar-custom {
      background: linear-gradient(90deg, #000, #1a1a1a);
    }

    .navbar-custom .navbar-brand {
      color: #FFD700;
      font-weight: 700;
    }

    .navbar-custom .nav-link {
      color: white;
      margin-left: 10px;
      font-weight: 500;
    }

    .navbar-custom .nav-link:hover {
      color: #FFD700;
    }

    .navbar-custom .navbar-toggler-icon {
      filter: invert(1);
    }

    /* CONTAINER */
    .container {
      padding: 30px;
    }

    h2 {
      margin-bottom: 20px;
    }

    /* BUTTON */
    .btn-gold {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      transition: all 0.25s ease;
      margin-bottom: 15px;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 215, 0, 0.4);
    }

    /* SEARCH */
    .search-input {
      padding: 8px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    /* TABLE CARD */
    .table-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      color: #777;
    }

    /* ATTENDANCE TOGGLE */
    input[type="radio"] {
      margin-right: 5px;
      accent-color: #C9A227;
      cursor: pointer;
    }

    /* MOBILE ADJUST */
    @media (max-width: 768px) {
      table {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand logo" href="dashboard.html">CoachBoard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks"
        aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarLinks">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="sessions.html">Sessions</a></li>
          <li class="nav-item"><a class="nav-link active" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTAINER -->
  <div class="container">

    <h2>Attendance</h2>

    <!-- SEARCH -->
    <input type="text" placeholder="Search players..." class="search-input">

    <!-- TABLE CARD -->
    <div class="table-card">
      <table>
        <tr>
          <th>Player</th>
          <th>Present</th>
          <th>Absent</th>
        </tr>
        <tr>
          <td>John Doe</td>
          <td><input type="radio" name="john" checked></td>
          <td><input type="radio" name="john"></td>
        </tr>
        <tr>
          <td>Michael Smith</td>
          <td><input type="radio" name="michael" checked></td>
          <td><input type="radio" name="michael"></td>
        </tr>
        <tr>
          <td>Peter Okello</td>
          <td><input type="radio" name="peter" checked></td>
          <td><input type="radio" name="peter"></td>
        </tr>
      </table>
    </div>

    <button class="btn-gold">Save Attendance</button>

  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
