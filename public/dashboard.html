<!DOCTYPE html>
<html>

<head>

  <title>CoachBoard Dashboard</title>

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    /* NAVBAR */
    .navbar-custom {
      background: linear-gradient(90deg, #000, #1a1a1a);
    }

    .navbar-custom .navbar-brand {
      color: #FFD700;
      font-weight: 700;
    }

    .navbar-custom .nav-link {
      color: white;
      margin-left: 10px;
      font-weight: 500;
    }

    .navbar-custom .nav-link:hover {
      color: #FFD700;
    }

    .navbar-custom .navbar-toggler-icon {
      filter: invert(1);
    }

    /* CONTAINER */
    .container {
      padding: 30px;
    }

    /* STATS CARDS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .card h3 {
      margin: 0;
      color: #777;
      font-size: 14px;
      font-weight: 500;
    }

    .card p {
      font-size: 28px;
      font-weight: 700;
      margin-top: 10px;
      color: #000;
    }
    .card:hover {
  transform: translateY(-5px);
}

    /* DASHBOARD GRID */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    /* CHART */
    .chart-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .chart-card h3 {
      margin-bottom: 15px;
    }

    .chart-card canvas {
      max-height: 250px;
      width: 100% !important;
    }

    /* TABLE */
    .table-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      color: #777;
    }

    /* GOLD BUTTON */
    .btn-gold {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      transition: all 0.25s ease;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(255, 215, 0, 0.4);
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand logo" href="dashboard.html">CoachBoard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks"
        aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarLinks">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="sessions.html">Sessions</a></li>
          <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <div class="container">

    <h2>Dashboard</h2>

    <!-- STATS CARDS -->
    <div class="stats">
      <div class="card">
        <h3>Total Players</h3>
        <p>22</p>
      </div>
      <div class="card">
        <h3>Training Sessions</h3>
        <p>8</p>
      </div>
      <div class="card">
        <h3>Attendance Rate</h3>
        <p>82%</p>
      </div>
    </div>

    <!-- GRID: CHART + RECENT SESSIONS -->
    <div class="dashboard-grid">

      <!-- PIE CHART -->
      <div class="chart-card">
        <h3>Attendance Overview</h3>
        <canvas id="attendanceChart"></canvas>
      </div>

      <!-- RECENT SESSIONS -->
      <div class="table-card">
        <h3>Recent Sessions</h3>
        <table>
          <tr>
            <th>Date</th>
            <th>Location</th>
            <th>Players</th>
          </tr>
          <tr>
            <td>12 March</td>
            <td>Main Field</td>
            <td>20</td>
          </tr>
          <tr>
            <td>10 March</td>
            <td>Training Ground</td>
            <td>18</td>
          </tr>
          <tr>
            <td>7 March</td>
            <td>Main Field</td>
            <td>21</td>
          </tr>
        </table>
      </div>

    </div>

  </div>

  <!-- CHART.JS -->
  <script>
    const ctx = document.getElementById('attendanceChart');
    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['Present', 'Absent'],
        datasets: [{
          data: [18, 4],
          backgroundColor: ['#FFD700', '#111'],
          borderWidth: 0
        }]
      },
      options: {
        plugins: {
          legend: {
            labels: {
              color: '#333'
            }
          }
        }
      }
    });
  </script>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
