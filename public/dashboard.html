<!DOCTYPE html>
<html>

<head>

  <title>CoachBoard Dashboard</title>

  <!-- Viewport for Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    /* NAVBAR */
    .navbar-custom {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    }

    .navbar-custom .navbar-brand {
      color: #FFD700;
      font-weight: 700;
      font-size: 1.5rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .navbar-custom .nav-link {
      color: #fff;
      margin-left: 20px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .navbar-custom .nav-link:hover {
      color: #FFD700;
      transform: translateY(-1px);
    }

    .navbar-custom .nav-link.active {
      color: #FFD700;
    }

    .navbar-custom .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #FFD700;
      border-radius: 1px;
    }

    /* MOBILE NAV IMPROVEMENTS */
    @media (max-width: 991px) {
      .navbar-custom {
        padding: 10px 15px;
      }

      .navbar-custom .navbar-brand {
        font-size: 1.2rem;
      }

      .navbar-custom .nav-link {
        margin-left: 0;
        padding: 10px 15px;
        text-align: center;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .navbar-custom .nav-link:hover {
        background: rgba(255, 215, 0, 0.1);
        color: #FFD700;
      }

      .navbar-collapse {
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        margin-top: 10px;
        padding: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }
    }

    /* CONTAINER */
    .container {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 30px;
      color: white;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      font-size: 2.5rem;
    }

    /* STATS CARDS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .card h3 {
      margin: 0 0 15px 0;
      color: #666;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card p {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* DASHBOARD GRID */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    /* CHART */
    .chart-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chart-card h3 {
      margin-bottom: 20px;
      color: #333;
      font-weight: 600;
      text-align: center;
    }

    .chart-card canvas {
      max-height: 300px;
      width: 100% !important;
    }

    /* TABLE */
    .table-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow-x: auto;
    }

    .table-card h3 {
      margin-bottom: 20px;
      color: #333;
      font-weight: 600;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      min-width: 600px; /* Ensure table doesn't get too narrow */
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: rgba(102, 126, 234, 0.05);
    }

    /* GOLD BUTTON */
    .btn-gold {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      h2 {
        font-size: 2rem;
      }

      .card {
        padding: 20px;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .card p {
        font-size: 2rem;
      }

      .table-card {
        padding: 15px;
        -webkit-overflow-scrolling: touch;
      }

      table {
        font-size: 0.85rem;
      }

      th, td {
        padding: 8px 12px;
        white-space: nowrap;
      }

      /* Touch-friendly buttons */
      .btn-gold {
        min-height: 44px;
        padding: 12px 20px;
        font-size: 0.95rem;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 20px 15px;
      }

      .table-card {
        padding: 10px;
      }

      table {
        font-size: 0.8rem;
      }

      th, td {
        padding: 6px 8px;
      }

      .card {
        min-height: 100px;
        padding: 15px;
      }

      .card p {
        font-size: 1.8rem;
      }
    }
  </style>

</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand logo" href="dashboard.html">CoachBoard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks"
        aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarLinks">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="sessions.html">Sessions</a></li>
          <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <div class="container">

    <h2>Dashboard</h2>

    <!-- STATS CARDS -->
    <div class="stats">
      <div class="card">
        <h3>Total Players</h3>
        <p id="totalPlayers">0</p>
      </div>
      <div class="card">
        <h3>Training Sessions</h3>
        <p id="totalSessions">0</p>
      </div>
      <div class="card">
        <h3>Attendance Rate</h3>
        <p id="attendanceRate">0%</p>
      </div>
    </div>

    <!-- GRID: CHART + RECENT SESSIONS -->
    <div class="dashboard-grid">

      <!-- PIE CHART -->
      <div class="chart-card">
        <h3>Attendance Overview</h3>
        <canvas id="attendanceChart"></canvas>
      </div>

      <!-- RECENT SESSIONS -->
      <div class="table-card">
        <h3>Recent Sessions</h3>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Location</th>
              <th>Players</th>
            </tr>
          </thead>
          <tbody id="recentSessionsTableBody">
            <!-- Dynamic rows will be added here -->
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let attendanceChart;

    // Load dashboard data on page load
    document.addEventListener('DOMContentLoaded', loadDashboardData);

    async function loadDashboardData() {
      try {
        // Load stats
        const [playersRes, sessionsRes, attendanceRes] = await Promise.all([
          fetch('/api/players'),
          fetch('/api/sessions'),
          fetch('/api/attendance')
        ]);

        const players = await playersRes.json();
        const sessions = await sessionsRes.json();
        const attendance = await attendanceRes.json();

        // Update stats
        document.getElementById('totalPlayers').textContent = players.length;
        document.getElementById('totalSessions').textContent = sessions.length;

        // Calculate attendance rate
        const totalAttendance = attendance.length;
        const presentCount = attendance.filter(a => a.present).length;
        const rate = totalAttendance > 0 ? Math.round((presentCount / totalAttendance) * 100) : 0;
        document.getElementById('attendanceRate').textContent = `${rate}%`;

        // Update chart
        updateChart(presentCount, totalAttendance - presentCount);

        // Update recent sessions (last 3)
        const recentSessions = sessions.slice(-3).reverse();
        const tbody = document.getElementById('recentSessionsTableBody');
        tbody.innerHTML = '';
        recentSessions.forEach(session => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${session.date}</td>
            <td>${session.location}</td>
            <td>${session.players_count || 0}</td>
          `;
          tbody.appendChild(row);
        });

      } catch (error) {
        console.error('Error loading dashboard data:', error);
      }
    }

    function updateChart(present, absent) {
      const ctx = document.getElementById('attendanceChart');
      
      if (attendanceChart) {
        attendanceChart.destroy();
      }

      attendanceChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Present', 'Absent'],
          datasets: [{
            data: [present, absent],
            backgroundColor: ['#FFD700', '#111'],
            borderWidth: 0
          }]
        },
        options: {
          plugins: {
            legend: {
              labels: {
                color: '#333'
              }
            }
          }
        }
      });
    }
  </script>

</body>

</html>
