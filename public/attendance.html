<!DOCTYPE html>
<html>

<head>
  <title>CoachBoard Attendance</title>

  <!-- Viewport for Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Fonts & Bootstrap -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    /* NAVBAR */
    .navbar-custom {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    }

    .navbar-custom .navbar-brand {
      color: #FFD700;
      font-weight: 700;
      font-size: 1.5rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .navbar-custom .nav-link {
      color: #fff;
      margin-left: 20px;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .navbar-custom .nav-link:hover {
      color: #FFD700;
      transform: translateY(-1px);
    }

    .navbar-custom .nav-link.active {
      color: #FFD700;
    }

    .navbar-custom .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #FFD700;
      border-radius: 1px;
    }

    /* MOBILE NAV IMPROVEMENTS */
    @media (max-width: 991px) {
      .navbar-custom {
        padding: 10px 15px;
      }

      .navbar-custom .navbar-brand {
        font-size: 1.2rem;
      }

      .navbar-custom .nav-link {
        margin-left: 0;
        padding: 10px 15px;
        text-align: center;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .navbar-custom .nav-link:hover {
        background: rgba(255, 215, 0, 0.1);
        color: #FFD700;
      }

      .navbar-collapse {
        background: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        margin-top: 10px;
        padding: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }
    }

    /* CONTAINER */
    .container {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 30px;
      color: white;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      font-size: 2.5rem;
    }

    /* BUTTON */
    .btn-gold {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
    }

    /* SEARCH */
    .search-input {
      padding: 12px 16px;
      width: 100%;
      max-width: 350px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: #FFD700;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
    }

    /* TABLE CARD */
    .table-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      min-width: 600px; /* Ensure table doesn't get too narrow */
    }

    th,
    td {
      padding: 15px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: rgba(102, 126, 234, 0.05);
    }

    /* ATTENDANCE TOGGLE */
    .attendance-radio {
      margin-right: 8px;
      accent-color: #FFD700;
      cursor: pointer;
      transform: scale(1.2);
      transition: all 0.3s ease;
    }

    .attendance-radio:hover {
      accent-color: #C9A227;
    }

    .attendance-label {
      margin-right: 15px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .attendance-present {
      color: #28a745;
    }

    .attendance-absent {
      color: #dc3545;
    }

    /* SAVE BUTTON */
    .btn-save {
      background: linear-gradient(135deg, #28a745, #20c997);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
    }

    /* ACTION BUTTONS */
    .btn-edit {
      background: linear-gradient(135deg, #FFD700, #C9A227);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: black;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .btn-delete {
      background: linear-gradient(135deg, #dc3545, #c82333);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 8px;
      transition: all 0.3s ease;
    }

    .btn-edit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
    }

    .btn-delete:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
    }

    /* ACTIONS CONTAINER */
    .actions-cell {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }

      h2 {
        font-size: 2rem;
      }

      .table-card {
        padding: 20px;
        -webkit-overflow-scrolling: touch;
      }

      table {
        font-size: 0.9rem;
      }

      th, td {
        padding: 10px;
      }

      .attendance-radio {
        transform: scale(1);
        margin-right: 5px;
        min-width: 20px;
        min-height: 20px;
      }

      .attendance-label {
        margin-right: 10px;
        font-size: 0.8rem;
        padding: 5px;
        min-height: 30px;
        display: flex;
        align-items: center;
      }

      /* Touch-friendly buttons */
      .btn-gold {
        min-height: 44px;
        padding: 12px 20px;
        font-size: 0.95rem;
      }

      .btn-save {
        min-height: 36px;
        padding: 8px 16px;
      }
    }

    @media (max-width: 500px) {
      .search-input {
        max-width: 100%;
        min-height: 44px;
        font-size: 16px; /* Prevent zoom on iOS */
      }

      .table-card {
        padding: 10px;
      }

      table {
        font-size: 0.8rem;
      }

      th, td {
        padding: 6px 8px;
      }

      .attendance-radio {
        transform: scale(0.8);
        margin-right: 3px;
        min-width: 16px;
        min-height: 16px;
      }

      .attendance-label {
        margin-right: 8px;
        font-size: 0.7rem;
        padding: 3px;
        min-height: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand logo" href="dashboard.html">CoachBoard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarLinks"
        aria-controls="navbarLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarLinks">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="players.html">Players</a></li>
          <li class="nav-item"><a class="nav-link" href="sessions.html">Sessions</a></li>
          <li class="nav-item"><a class="nav-link active" href="attendance.html">Attendance</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTAINER -->
  <div class="container">

    <h2>Attendance</h2>

    <!-- SEARCH -->
    <input type="text" placeholder="Search players..." class="search-input">

    <!-- TABLE CARD -->
    <div class="table-card">
      <table id="attendanceTable">
        <thead>
          <tr>
            <th>Player</th>
            <th>Session</th>
            <th>Present</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="attendanceTableBody">
          <!-- Dynamic rows will be added here -->
        </tbody>
      </table>
    </div>

    <button class="btn-gold" onclick="openAddModal()">Add Attendance</button>

  </div>

  <!-- ADD / EDIT ATTENDANCE MODAL -->
  <div class="modal fade" id="attendanceModal" tabindex="-1" aria-labelledby="attendanceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="attendanceModalLabel">Add Attendance</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="attendanceForm">
            <div class="mb-3">
              <label for="attendancePlayer" class="form-label">Player</label>
              <select class="form-control" id="attendancePlayer" required>
                <option value="">Select Player</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="attendanceSession" class="form-label">Session</label>
              <select class="form-control" id="attendanceSession" required>
                <option value="">Select Session</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="attendancePresent" class="form-label">Present</label>
              <select class="form-control" id="attendancePresent" required>
                <option value="true">Yes</option>
                <option value="false">No</option>
              </select>
            </div>
            <button type="submit" class="btn btn-gold">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let editingAttendanceId = null;
    let players = [];
    let sessions = [];

    // Load data on page load
    document.addEventListener('DOMContentLoaded', async () => {
      await loadPlayers();
      await loadSessions();
      loadAttendance();
    });

    async function loadPlayers() {
      try {
        const response = await fetch('/api/players');
        players = await response.json();
        const select = document.getElementById('attendancePlayer');
        select.innerHTML = '<option value="">Select Player</option>';
        players.forEach(player => {
          const option = document.createElement('option');
          option.value = player.id;
          option.textContent = player.name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading players:', error);
      }
    }

    async function loadSessions() {
      try {
        const response = await fetch('/api/sessions');
        sessions = await response.json();
        const select = document.getElementById('attendanceSession');
        select.innerHTML = '<option value="">Select Session</option>';
        sessions.forEach(session => {
          const option = document.createElement('option');
          option.value = session.id;
          option.textContent = `${session.date} ${session.time} - ${session.location}`;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading sessions:', error);
      }
    }

    async function loadAttendance() {
      try {
        const response = await fetch('/api/attendance');
        const attendance = await response.json();
        const tbody = document.getElementById('attendanceTableBody');
        tbody.innerHTML = '';
        attendance.forEach(att => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${att.players?.name || 'Unknown'}</td>
            <td>${att.sessions?.date || ''} ${att.sessions?.time || ''} - ${att.sessions?.location || ''}</td>
            <td>${att.present ? 'Yes' : 'No'}</td>
            <td>
              <div class="actions-cell">
                <button class="btn-edit" onclick="openEditModal(${att.id}, ${att.player_id}, ${att.session_id}, ${att.present})">Edit</button>
                <button class="btn-delete" onclick="deleteAttendance(${att.id})">Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('Error loading attendance:', error);
      }
    }

    function openEditModal(id, playerId, sessionId, present) {
      editingAttendanceId = id;
      document.getElementById('attendancePlayer').value = playerId;
      document.getElementById('attendanceSession').value = sessionId;
      document.getElementById('attendancePresent').value = present.toString();
      document.getElementById('attendanceModalLabel').innerText = 'Edit Attendance';
      new bootstrap.Modal(document.getElementById('attendanceModal')).show();
    }

    function openAddModal() {
      editingAttendanceId = null;
      document.getElementById('attendanceForm').reset();
      document.getElementById('attendanceModalLabel').innerText = 'Add Attendance';
      new bootstrap.Modal(document.getElementById('attendanceModal')).show();
    }

    // Handle form submit
    document.getElementById('attendanceForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const player_id = parseInt(document.getElementById('attendancePlayer').value);
      const session_id = parseInt(document.getElementById('attendanceSession').value);
      const present = document.getElementById('attendancePresent').value === 'true';

      try {
        if (editingAttendanceId) {
          // Update attendance
          await fetch(`/api/attendance/${editingAttendanceId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ player_id, session_id, present })
          });
        } else {
          // Add attendance
          await fetch('/api/attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ player_id, session_id, present })
          });
        }
        loadAttendance(); // Reload the table
        bootstrap.Modal.getInstance(document.getElementById('attendanceModal')).hide();
        this.reset();
        editingAttendanceId = null;
        document.getElementById('attendanceModalLabel').innerText = 'Add Attendance';
      } catch (error) {
        console.error('Error saving attendance:', error);
      }
    });

    async function deleteAttendance(id) {
      if (confirm('Are you sure you want to delete this attendance record?')) {
        try {
          await fetch(`/api/attendance/${id}`, { method: 'DELETE' });
          loadAttendance(); // Reload the table
        } catch (error) {
          console.error('Error deleting attendance:', error);
        }
      }
    }
  </script>

</body>

</html>
